[pytest]
# Где искать тесты. Без этого pytest обходит весь проект, включая .venv.
testpaths = tests

# Как pytest узнаёт тесты: файлы test_*.py, функции test_*.
python_files = test_*.py
python_functions = test_*

# asyncio_mode=auto — плагин сам подхватывает «async def test_…».
# Иначе каждый асинхронный тест пришлось бы помечать @pytest.mark.asyncio.
asyncio_mode = auto

# Каждому async-тесту — свой event loop, чтобы тесты не влияли друг
# на друга через общее состояние цикла.
asyncio_default_fixture_loop_scope = function

# -q       — компактный вывод
# --strict-markers — опечатка в имени маркера станет ошибкой, а не
#            молча проигнорируется
addopts = -q --strict-markers
