# ═══════════════════════════════════════════════════════════════
#  Запуск бота одной командой:  docker compose up -d
#
#  Здесь описано ВСЁ, что нужно для работы: образ, переменные,
#  подключённые папки, политика перезапуска. Заказчику не придётся
#  вспоминать флаги docker run.
# ═══════════════════════════════════════════════════════════════

services:
  bot:
    build: .
    # Имя контейнера фиксируем, чтобы команды вида
    # `docker logs music-school-bot` работали предсказуемо.
    container_name: music-school-bot

    # Перезапуск при падении и при старте сервера.
    # unless-stopped, а не always: если бот остановлен вручную
    # (docker compose stop), он не поднимется сам после перезагрузки —
    # значит, остановка была намеренной.
    restart: unless-stopped

    # Секреты передаются переменными окружения, а не копируются
    # в образ. Файл читается при старте контейнера.
    env_file:
      - .env

    volumes:
      # База заявок. Это САМОЕ важное подключение: без него данные
      # живут внутри контейнера и исчезнут при первом же обновлении
      # образа. С volume база лежит на диске сервера и переживает
      # пересборку, перезапуск и обновление бота.
      - ./data:/app/data

      # Логи — чтобы читать их с сервера, а не только через docker logs.
      - ./logs:/app/logs

      # Конфиг школы: :ro — только чтение. Бот его не меняет, а владелец
      # может править файл на сервере и перезапускать контейнер,
      # не пересобирая образ.
      - ./config:/app/config:ro

      # Ключ Google. Тоже только чтение.
      - ./secrets:/app/secrets:ro

    # Сколько ждать после SIGTERM, прежде чем убить процесс.
    # Боту нужно закрыть базу и досинхронизировать — 30 секунд с запасом.
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        # Без ограничения docker-логи растут бесконечно и однажды
        # займут весь диск сервера. Своё логирование в файл у нас
        # уже с ротацией, но docker пишет ещё и свой поток.
        max-size: "10m"
        max-file: "3"
