# ═══════════════════════════════════════════════════════════════
#  Конфигурация школы. Этот файл правит владелец — без программиста.
#
#  Как добавить направление: скопируй любой блок, начинающийся
#  с «- id:», и поменяй значения. После правок перезапусти бота —
#  если в файле ошибка, бот скажет об этом при старте.
#
#  Правила:
#    id       — латиница/цифры/подчёркивание, уникален, НЕ менять
#               после запуска (он попадает в сохранённые заявки)
#    цена     — целое число, без пробелов и символа валюты
# ═══════════════════════════════════════════════════════════════

school:
  name: "Школа музыки «Аккорд»"
  currency: "₽"
  # Код страны для номеров, введённых без «+»: «89001234567» → +7…
  # RU — Россия, BY — Беларусь, KZ — Казахстан, UA — Украина.
  phone_region: "RU"
  # Часовой пояс школы — в этом времени владелец видит заявки
  # и в нём же считается, какие слоты уже прошли.
  # Europe/Moscow, Asia/Almaty, Europe/Minsk, Asia/Tashkent…
  timezone: "Europe/Moscow"

  # ── Когда можно записаться на пробное занятие ──
  #
  # Слоты НЕ перечисляем вручную — бот строит их сам из интервалов
  # и шага. Как менять:
  #   • другой график дня  → поправь интервал, например "10:00-19:00"
  #   • перерыв на обед    → два интервала: ["10:00-14:00", "15:00-19:00"]
  #   • выходной           → УДАЛИ строку этого дня целиком
  #
  # Интервал полуоткрытый: "12:00-20:00" при шаге 60 даёт слоты
  # 12:00…19:00. В 20:00 школа закрывается, занятие уже не начинается.
  schedule:
    # Шаг сетки времени в минутах. Должен делить каждый интервал нацело,
    # иначе бот откажется стартовать и скажет, где не сходится.
    slot_minutes: 60

    # На сколько дней вперёд открыта запись.
    booking_horizon_days: 14

    # За сколько часов до начала закрывать запись на сегодня.
    # Нужен запас, чтобы администратор успел перезвонить и подтвердить.
    booking_buffer_hours: 2

    week:
      mon: ["12:00-20:00"]
      tue: ["12:00-20:00"]
      wed: ["12:00-20:00"]
      thu: ["12:00-20:00"]
      fri: ["12:00-20:00"]
      sat: ["10:00-18:00"]
      # sun не указан → воскресенье выходной

directions:
  - id: guitar
    title: "Гитара"
    emoji: "🎸"
    description: "Акустическая и электрогитара с нуля. Первые аккорды — уже на втором занятии."
    price_per_lesson: 1200
    lesson_minutes: 60

  - id: piano
    title: "Фортепиано"
    emoji: "🎹"
    description: "Классика и современные песни. Ставим руки, учим читать ноты."
    price_per_lesson: 1400
    lesson_minutes: 60

  - id: vocal
    title: "Вокал"
    emoji: "🎤"
    description: "Эстрадный вокал: дыхание, опора, снятие зажимов. Дети и взрослые."
    price_per_lesson: 1500
    lesson_minutes: 45

  - id: drums
    title: "Барабаны"
    emoji: "🥁"
    description: "Ударная установка: ритм, координация, первые биты за месяц."
    price_per_lesson: 1300
    lesson_minutes: 45

  - id: violin
    title: "Скрипка"
    emoji: "🎻"
    description: "Академическая школа, постановка с первых уроков. Возраст от 5 лет."
    price_per_lesson: 1600
    lesson_minutes: 45
